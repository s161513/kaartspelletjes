<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <!-- The URL holds the secret key; don't send it along as Referer. -->
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>67 Counter</title>
    <link rel="stylesheet" href="/counter.css" />
  </head>
  <body class="sx-body">
    <!-- 67 Beschaving: the shared town, full screen behind the counter. -->
    <canvas class="sx-world" id="sx-world" aria-label="De stad van 67 Beschaving: sleep om rond te kijken, klik op een dorpeling om te kiezen wat die doet, op vrij land om te bouwen, op een gebouw voor info of de winkel"></canvas>

    <div class="sx-topstack">
      <header class="sx-top" id="sx-top">
        <a class="sx-back" href="/">← terug</a>
        <div class="sx-counter">
          <h1 class="sx-title"><span class="sx-title-hand">🤲</span> 67 COUNTER</h1>
          <button class="sx-btn sx-btn-dec" id="sx-dec" type="button" disabled aria-label="min één" title="oeps, was geen 67 (−)">−</button>
          <div class="sx-count" id="sx-count" aria-live="polite" title="keer 67 gedaan">–</div>
          <button class="sx-btn sx-btn-inc" id="sx-inc" type="button" disabled aria-label="plus één" title="67 gespot! (+ of spatie)">+</button>
        </div>
        <div class="sx-status">
          <button class="sx-me" id="sx-me" type="button" title="jouw NPC aanpassen" hidden>🧍</button>
          <span class="sx-conn" id="sx-conn" data-state="connecting">
            <span class="sx-dot"></span><span id="sx-conn-text">verbinden…</span>
          </span>
          <span class="sx-online" id="sx-online">👀 – kijkers live</span>
        </div>
        <p class="sx-next" id="sx-next"></p>
      </header>
      <div class="sx-hud" id="sx-hud" aria-live="off" hidden></div>
      <div class="sx-banner" id="sx-banner" role="status" hidden></div>
    </div>

    <div class="sx-vote" id="sx-vote" role="status" hidden></div>
    <div class="sx-inspect" id="sx-inspect" role="dialog" hidden></div>
    <div class="sx-place" id="sx-place" role="dialog" aria-label="Bouwen" hidden></div>
    <div class="sx-avatar" id="sx-avatar" role="dialog" aria-label="Jouw NPC" hidden></div>
    <div class="sx-fabs">
      <button class="sx-fab" id="sx-paths" type="button" title="paden tekenen of weghalen" aria-label="paden tekenen of weghalen">🛤️</button>
      <button class="sx-fab" id="sx-recenter" type="button" title="terug naar het centrum" aria-label="terug naar het centrum">🎯</button>
    </div>

    <p class="sx-credits">pixel art: Yar, sketchylogic (CC-BY 3.0), pixel32 (CC0) · <a href="https://opengameart.org" target="_blank" rel="noopener">OpenGameArt</a></p>
    <div class="sx-overlay" id="sx-overlay" aria-hidden="true">
      <span class="sx-ov-hand sx-ov-hand-l">🤲</span>
      <span class="sx-ov-67">6️⃣7️⃣</span>
      <span class="sx-ov-hand sx-ov-hand-r">🤲</span>
    </div>
    <div class="sx-fx" id="sx-fx" aria-hidden="true"></div>

    <script type="module" src="/src/counter.ts"></script>
  </body>
</html>
