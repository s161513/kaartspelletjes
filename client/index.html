<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Classroom Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="hero">
        <span class="brandmark" aria-hidden="true"><span class="bm-back">♥</span><span class="bm-front">♠</span></span>
        <div>
          <h1>Classroom Games</h1>
          <p class="tagline">Pull up a chair — join a table or open your own.</p>
        </div>
      </header>

      <a class="counter-link" href="/counter.html">🤲 Ga naar de 67 counter</a>

      <div class="card landing-resume" id="resume" hidden>
        <span id="resumeText"></span>
        <button type="button" id="resumeBtn">Move it to this tab</button>
      </div>

      <div class="card">
        <label for="nickname">Your name</label>
        <input id="nickname" type="text" placeholder="e.g. Alice" maxlength="24" autocomplete="off" />

        <form class="create-form" id="createForm">
          <div>
            <label for="roomName">New room</label>
            <input id="roomName" type="text" placeholder="Room name (optional)" maxlength="32" autocomplete="off" />
          </div>
          <div>
            <label for="roomPassword">Password</label>
            <input id="roomPassword" type="password" placeholder="Optional" maxlength="64" autocomplete="new-password" />
          </div>
          <button type="submit" id="create">Create room</button>
        </form>
        <p id="error" class="error"></p>
      </div>

      <div class="section-head">
        <h2>Open rooms</h2>
        <span class="muted" id="roomCount"></span>
      </div>
      <ul class="room-list" id="roomList">
        <li class="room-empty">Loading rooms…</li>
      </ul>
    </div>
    <script type="module" src="/src/landing.ts"></script>
  </body>
</html>
