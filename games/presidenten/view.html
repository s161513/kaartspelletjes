<div class="pr">
  <div class="pr-table">
    <div class="pr-rail">
      <div class="pr-felt">
        <div class="pr-pile"></div>
        <div class="pr-sweep"></div>
        <div class="pr-banner" hidden></div>
        <div class="pr-exchange" hidden>
          <p class="pr-exchange-title"></p>
          <p class="pr-exchange-msg"></p>
          <div class="pr-ranks" aria-label="Ranks you can ask for"></div>
        </div>
      </div>
    </div>
    <div class="pr-seats"></div>
  </div>

  <div class="pr-hand-area">
    <div class="pr-prompt" aria-live="polite"></div>
    <div class="pr-countdown" hidden>
      <progress value="0" aria-label="Time left this turn"></progress>
      <span class="pr-time"></span>
    </div>
    <div class="pr-hand" aria-label="Your private hand"></div>
    <div class="pr-actions">
      <button type="button" class="pr-btn pr-btn-pass secondary" hidden>Pass</button>
      <button type="button" class="pr-btn pr-btn-play" hidden>Play</button>
      <button type="button" class="pr-btn pr-btn-give" hidden>Give back</button>
    </div>
    <p class="pr-assist-tip" hidden></p>
  </div>

  <!-- Adaptive help (assist/): how much help you get depends on your history. -->
  <details class="pr-assist">
    <summary>💡 Help · <span class="pr-assist-level">level 0</span></summary>
    <div class="pr-assist-body">
      <label><input type="checkbox" class="pr-assist-helpme" /> Help me (highlight good moves)</label>
      <label><input type="checkbox" class="pr-assist-history" /> Use my history to decide how much</label>
      <label class="pr-assist-host" hidden>
        <input type="checkbox" class="pr-assist-room" /> Allow help in this room (host)
      </label>
      <p class="pr-assist-hostnote" hidden>The host has turned help off for this room.</p>
      <table class="pr-assist-why" aria-label="Why you get this much help"></table>
      <p class="pr-assist-nocontext" hidden>History ignored: everyone gets the same light hints.</p>
      <p class="pr-assist-memory"></p>
      <button type="button" class="pr-assist-forget secondary">Forget my history</button>
    </div>
  </details>

  <p class="pr-help">A 2 is wild and must be played with another card whose rank it copies.
    Four of a rank in a row burns the pile.</p>
</div>
