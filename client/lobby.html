<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lobby · Classroom Games</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="wrap">
      <h1>Lobby</h1>

      <div class="card">
        <label>Room code — share this to invite others</label>
        <div class="room-code" id="roomCode">----</div>
      </div>

      <div class="card">
        <label>Players</label>
        <ul class="players" id="players"></ul>
      </div>

      <div class="card">
        <label>Choose a game</label>
        <div class="game-list" id="gameList"></div>
        <p id="hint" class="error"></p>
        <div class="row" style="margin-top: 0.5rem">
          <button id="leave" class="secondary">Leave room</button>
        </div>
      </div>

      <div class="card">
        <label>Chat</label>
        <div class="chat-log" id="chatLog"></div>
        <form class="chat-form" id="chatForm">
          <input id="chatInput" type="text" placeholder="Say something…" maxlength="500" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
    <script type="module" src="/src/lobby.ts"></script>
  </body>
</html>
