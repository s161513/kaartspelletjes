<div class="hearts">
  <div class="hearts-table">
    <div class="hearts-rail">
      <div class="hearts-felt">
        <div class="hearts-trick"></div>
        <div class="hearts-broken" hidden>♥ broken</div>
        <div class="hearts-banner" hidden></div>
      </div>
    </div>
    <div class="hearts-seats"></div>
  </div>

  <div class="hearts-hand-area">
    <div class="hearts-prompt"></div>
    <div class="hearts-hand"></div>
    <div class="hearts-actions">
      <button type="button" class="hearts-btn hearts-btn-pass" hidden>Pass</button>
      <button type="button" class="hearts-btn hearts-btn-next" hidden>Next round</button>
    </div>
  </div>

  <details class="hearts-scores-wrap">
    <summary>Scoreboard</summary>
    <table class="hearts-scores"></table>
  </details>
</div>
